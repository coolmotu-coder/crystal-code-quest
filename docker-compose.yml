services:
  crystal-code-quest:
    build:
      context: .
      dockerfile: Dockerfile
    image: crystal-code-quest:${IMAGE_TAG:-local}
    container_name: crystal-code-quest
    env_file:
      - .env.local
    environment:
      - DATABASE_PATH=/data/crystal-code-quest.db
    ports:
      - "3000:3000"
    volumes:
      - crystal-code-quest-data:/data
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  crystal-code-quest-data:
