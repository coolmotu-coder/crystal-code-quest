apiVersion: apps/v1
kind: Deployment
metadata:
  name: crystal-code-quest
  namespace: crystal-code-quest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crystal-code-quest
  template:
    metadata:
      labels:
        app: crystal-code-quest
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: app
          image: crystal-code-quest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: crystal-code-quest
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: crystal-code-quest
                  key: session-secret
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: crystal-code-quest-data
